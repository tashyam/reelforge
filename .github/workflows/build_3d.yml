name: 3D Cartoon Video Factory

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (or 'auto' to pick one)"
        required: false
        default: "auto"
      mode:
        description: "real = true story, comic = fake origin story"
        required: false
        default: "real"
  schedule:
    - cron: "0 12 * * *"

jobs:
  render-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

